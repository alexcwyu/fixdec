name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flags:
          - ""                       # default (pure no_std)
          - "--features serde"
          - "--features bytemuck"
          - "--features zerocopy"
          - "--features num-traits"
          - "--all-features"
    name: test (${{ matrix.flags == '' && 'default' || matrix.flags }})
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --verbose ${{ matrix.flags }}
      - name: Run tests
        run: cargo test --verbose ${{ matrix.flags }}

  check:
    runs-on: ubuntu-latest
    name: check (no_std + feature matrix)
    steps:
      - uses: actions/checkout@v4
      - run: cargo check --no-default-features
      - run: cargo check --no-default-features --features full
      - run: cargo check --no-default-features --features rkyv
      - run: cargo check --all-features
      - run: cargo check --benches --all-features

  no-std:
    runs-on: ubuntu-latest
    name: no_std (bare-metal build, each no_std feature)
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add thumbv7em-none-eabi
      # Build each no_std-capable feature against a real bare-metal target so a
      # dependency silently pulling `std` (e.g. serde without default-features=false)
      # fails CI instead of only the host build that always has std.
      - run: cargo build --no-default-features --target thumbv7em-none-eabi
      - run: cargo build --no-default-features --features serde --target thumbv7em-none-eabi
      - run: cargo build --no-default-features --features bytemuck --target thumbv7em-none-eabi
      - run: cargo build --no-default-features --features zerocopy --target thumbv7em-none-eabi
      - run: cargo build --no-default-features --features num-traits --target thumbv7em-none-eabi
      - run: cargo build --no-default-features --features rust-decimal --target thumbv7em-none-eabi
      - run: cargo build --no-default-features --features rkyv --target thumbv7em-none-eabi

  differential:
    runs-on: ubuntu-latest
    name: differential (release, 1M iters)
    steps:
      - uses: actions/checkout@v4
      - name: Differential fuzz vs rust_decimal + i128 oracle
        env:
          DIFF_ITERS: "1000000"
        run: cargo test --release --all-features --test differential
      - name: sqrt differential vs rust_decimal + f64 + integer oracle
        run: cargo run --release --example sqrt_diff -- 1000000

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - name: Clippy (all targets, warnings are errors)
        run: cargo clippy --all-features --all-targets -- -D warnings
