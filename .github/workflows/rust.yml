name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flags:
          - ""                       # default (pure no_std)
          - "--features serde"
          - "--features bytemuck"
          - "--features zerocopy"
          - "--features num-traits"
          - "--all-features"
    name: test (${{ matrix.flags == '' && 'default' || matrix.flags }})
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --verbose ${{ matrix.flags }}
      - name: Run tests
        run: cargo test --verbose ${{ matrix.flags }}

  differential:
    runs-on: ubuntu-latest
    name: differential (release, 1M iters)
    steps:
      - uses: actions/checkout@v4
      - name: Differential fuzz vs rust_decimal + i128 oracle
        env:
          DIFF_ITERS: "1000000"
        run: cargo test --release --all-features --test differential

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - name: Clippy (all features, tests + examples)
        run: cargo clippy --all-features --tests --examples
