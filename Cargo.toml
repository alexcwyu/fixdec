[package]
name = "fixdec"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "High-performance fixed-point decimal types for financial calculations and cryptocurrency"
repository = "https://github.com/Abso1ut3Zer0/fixdec"
rust-version = "1.89.0"
readme = "README.md"
keywords = ["decimal", "fixed-point", "finance", "cryptocurrency", "no-std"]
categories = ["mathematics", "no-std", "data-structures"]
exclude = [
    ".github/",
    ".idea/",
    ".editorconfig",
    ".gitignore",
    "CONTRIBUTING.md",
]

[dependencies]
serde = { version = "1.0.228", optional = true }
bytemuck = { version = "1", optional = true, default-features = false }
zerocopy = { version = "0.8", optional = true, default-features = false, features = ["derive"] }
num-traits = { version = "0.2", optional = true, default-features = false }
# Optional rust_decimal interop. default-features = false keeps it no_std
# (rust_decimal's default features pull in `serde` + `std`).
rust_decimal = { version = "1.39.0", optional = true, default-features = false }
# Optional PyO3 interop (D64/D96 <-> Python decimal.Decimal). PyO3 links
# libpython and needs a Python toolchain, so this feature is std-only and is
# deliberately NOT part of `full`.
pyo3 = { version = "0.26", optional = true, default-features = false }
# Optional rkyv 0.8 zero-copy archival. default-features = false keeps it no_std;
# we re-add `alloc` (to_bytes/access/from_bytes allocate an AlignedVec/arena) and
# `bytecheck` (the safe, validated access path that enforces D96's 96-bit range).
# Archived integers are portable little-endian via rkyv's `rend`.
rkyv = { version = "0.8", optional = true, default-features = false, features = ["alloc", "bytecheck"] }
# default-features = false drops thiserror's `std` feature so the crate stays
# truly no_std (thiserror exposes the `Error` impls via core on 2.x).
thiserror = { version = "2.0.17", default-features = false }

[features]
default = []
alloc = []
std = ["alloc"]
serde = ["dep:serde", "alloc"]
bytemuck = ["dep:bytemuck"]
zerocopy = ["dep:zerocopy"]
num-traits = ["dep:num-traits"]
rust-decimal = ["dep:rust_decimal", "alloc"]
pyo3 = ["dep:pyo3", "std"]
# rkyv needs alloc for to_bytes/access/from_bytes; bytecheck validation is bundled.
rkyv = ["dep:rkyv", "alloc"]
full = ["std", "serde", "bytemuck", "zerocopy", "num-traits", "rust-decimal", "rkyv"]

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }
rust_decimal = { version = "1.39.0", features = ["maths", "serde"] }
proptest = "1.9.0"
serde = "1.0.228"
serde_json = "1.0.145"
bincode = "1.3"
bytemuck = "1"
zerocopy = { version = "0.8", features = ["derive"] }
num-traits = { version = "0.2", default-features = false }
rkyv = { version = "0.8", features = ["alloc", "bytecheck"] }
# Competitor decimal/fixed-point crates — used only by examples/bench_vs_libs.rs
fixed = { version = "1.31", features = ["std"] }
fpdec = "0.14.1"
bigdecimal = "0.4.10"
# auto-initialize lets the pyo3 interop tests start an embedded interpreter;
# rust_decimal enables PyO3's native Decimal <-> rust_decimal::Decimal conversion
# (used by examples/bench_pyo3.rs for an apples-to-apples comparison).
# default-features = false mirrors the optional dependency.
pyo3 = { version = "0.26", default-features = false, features = ["auto-initialize", "rust_decimal"] }

[profile.bench]
opt-level = 3           # Maximum optimizations (default)
lto = true              # Link-time optimization (optional, makes builds slower but binaries faster)
codegen-units = 1       # Better optimization (optional, slower build)
debug = false           # No debug info (default)

[[bench]]
name = "bench_d64"
harness = false

[[bench]]
name = "bench_d96"
harness = false

[[bench]]
name = "bench_f64"
harness = false

[[bench]]
name = "bench_rust_decimal"
harness = false

[[bench]]
name = "bench_serde"
harness = false
required-features = ["serde"]

[[example]]
name = "bench_pyo3"
required-features = ["pyo3"]
